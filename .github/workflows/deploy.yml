name: Pages deploy
on:
  push:
    branches:
      - main
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          
      - name: Install dependencies
        run: bundle install
        working-directory: docs

      - name: Build jekyll
        run: bundle exec jekyll build
        working-directory: docs

      - name: Upload pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  pages-deploy:
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
