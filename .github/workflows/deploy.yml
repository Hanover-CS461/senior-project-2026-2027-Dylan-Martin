name: Pages deploy
on:
  push:
    branches:
      - main
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          
      - name: Install dependencies
        run: bundle install
        working-directory: docs

      - name: Build jekyll
        run: bundle exec jekyll build
        working-directory: docs

      - name: Upload pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  pages-deploy:
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: Github Pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4

  slides-deploy:
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Build slides
        run: marp slides.md -o _site/slides/index.html
        working-directory: docs/slides

      - name: Copy slide assets
        run: |
          mkdir -p _site/slides/assets
          cp -r slides/assets/. _site/slides/assets/
        working-directory: docs

      - name: Upload pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site
